<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>复合材料原理 · 思维导图</title>
<style>
:root{color-scheme:light;--background:#f6f4ef;--foreground:#1d1c1a;--muted-foreground:#6d6a64;--border:#e2ded6;--ring:#c2410c;--popover:#ffffff;}
/* ===== 复合材料原理 · 思维导图 ===== */
body.st{ margin:0; background:var(--background, #f6f4ef); }
.mm-app{
  --m-fg: var(--foreground, #1d1c1a);
  --m-mut: var(--muted-foreground, #6d6a64);
  --m-bd: var(--border, #e2ded6);
  --m-ring: var(--ring, #c2410c);
  --m-pop: var(--popover, #ffffff);
  display:flex; flex-direction:column;
  width:100%; height:var(--mm-h, 660px);
  font-size:14px; color:var(--m-fg);
  background:var(--m-bg, transparent);
}
.mm-app.st-app{ height:100vh; }
.mm-bar{
  display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  padding:8px 10px; border-bottom:1px solid var(--m-bd);
}
.mbtn{
  appearance:none; border:1px solid var(--m-bd); background:var(--m-pop);
  color:var(--m-fg); border-radius:8px; padding:5px 11px; font-size:13px;
  line-height:1.5; min-height:32px; cursor:pointer;
}
.mbtn:hover{ border-color:var(--m-ring); }
.msel{
  border:1px solid var(--m-bd); background:var(--m-pop); color:var(--m-fg);
  border-radius:8px; padding:5px 8px; font-size:13px; min-height:32px; max-width:180px;
}
.minput{
  flex:1 1 130px; min-width:120px; max-width:260px;
  border:1px solid var(--m-bd); background:var(--m-pop); color:var(--m-fg);
  border-radius:8px; padding:5px 10px; font-size:13px; min-height:32px;
}
.mcount{ font-size:12px; color:var(--m-mut); white-space:nowrap; }
.mspacer{ flex:1 1 0; }
.mm-vp{
  position:relative; flex:1; overflow:hidden; touch-action:none;
  cursor:grab; user-select:none; -webkit-user-select:none;
}
.mm-vp.dragging{ cursor:grabbing; }
.mm-edges{ position:absolute; left:0; top:0; width:10px; height:10px; overflow:visible; }
.mm-world{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
.mm-node{
  position:absolute; left:0; top:0; box-sizing:border-box;
  width:max-content; max-width:300px; padding:6px 10px; border-radius:10px;
  font-size:13px; line-height:1.5; overflow-wrap:break-word;
  border:1px solid var(--nc, transparent);
  background:var(--nb, transparent);
  box-shadow:0 1px 2px rgb(0 0 0 / 0.04);
}
.mm-node .mm-badge{
  display:inline-block; margin-left:6px; padding:0 6px; border-radius:99px;
  font-size:11px; line-height:18px; vertical-align:1px;
  background:var(--nc, transparent); color:var(--m-fg); opacity:.75;
}
.mm-node.d0{ font-size:16px; font-weight:500; padding:10px 16px; border-radius:14px; }
.mm-node.d1{ font-size:14px; font-weight:500; border-left:4px solid var(--nc, transparent); }
.mm-node.d2{ font-weight:500; }
.mm-node.leaf{ font-size:12.5px; }
.mm-node.star{ border-style:dashed; }
.mm-node.hit{ box-shadow:0 0 0 2px var(--m-ring); }
.mm-node.dim{ opacity:.35; }
.mm-hint{
  padding:5px 10px; font-size:11px; color:var(--m-mut);
  border-top:1px solid var(--m-bd);
}
.mm-node .mm-term{ font-weight:500; }
.mm-node .mm-arrow{ color:var(--m-mut); }

</style>
</head>
<body class="st">
<div id="ccm-root" class="mm-app st-app">
  <div class="mm-bar" role="toolbar" aria-label="思维导图工具栏">
    <button type="button" class="mbtn" data-act="home" data-tooltip="回到根节点">⌂</button>
    <button type="button" class="mbtn" data-act="chapters" data-tooltip="只展开到各章小节">章节</button>
    <button type="button" class="mbtn" data-act="expand" data-tooltip="展开全部节点">全部展开</button>
    <button type="button" class="mbtn" data-act="collapse" data-tooltip="只留根与章">收起</button>
    <select id="ccm-jump" class="msel" aria-label="跳转到章节"></select>
    <span class="mspacer"></span>
    <input id="ccm-q" class="minput" type="text" placeholder="搜索知识点…" aria-label="搜索知识点">
    <span id="ccm-count" class="mcount" aria-live="polite"></span>
    <button type="button" class="mbtn" data-act="zoomin" data-tooltip="放大">＋</button>
    <button type="button" class="mbtn" data-act="zoomout" data-tooltip="缩小">－</button>
    <button type="button" class="mbtn" data-act="fit" data-tooltip="适应窗口">⛶</button>
  </div>
  <div class="mm-vp" id="ccm-vp" role="img" aria-label="复合材料原理思维导图，可拖动平移、滚轮或双指缩放、点击节点展开折叠">
    <div class="mm-world" id="ccm-world">
      <svg class="mm-edges" aria-hidden="true"><g id="ccm-edges"></g></svg>
    </div>
  </div>
  <div class="mm-hint">拖动平移 · 滚轮 / 双指缩放 · 点击节点展开或折叠</div>
</div>
<script id="ccm-data" type="application/json">{"t":"复合材料原理","c":[{"t":"第1章 绪论","c":[{"t":"核心概念与辨析","c":[{"t":"物质：不以人的意志为转移的客观存在，世界由物质组成","c":[]},{"t":"材料：人类用来制造产品的物质，有了人类才产生","c":[]},{"t":"复合材料：经选择的两种及以上组分人工复合的多相材料——三维结合、各相间有明显界面、具有特殊性能","c":[]},{"t":"复合物质：大自然天然形成的复合结构（竹子、贝壳、人骨、皮肤），靠自然力量复合","c":[]},{"t":"三要素：基体 · 增强体 · 界面（界面不是析出相、也不一定是反应层）","c":[]},{"t":"组成形式：连续分布的基体相 ＋ 不连续分布的分散相（增强相）","c":[]}]},{"t":"六大特点","c":[{"t":"① 组分及比例均为人为选择设计 → 可设计性极强","c":[]},{"t":"② 复合后各组分仍保持各自固有的物理化学特性","c":[]},{"t":"③ 设计合理时兼具各组分优点，还可经复合效应产生单组分没有的特殊性能","c":[]},{"t":"④ 性能取决于各组分性能＋复合效应，不是简单叠加","c":[]},{"t":"⑤ 组分间存在明显界面 → 是一种多相材料","c":[]},{"t":"⑥ 人工制备而非天然形成","c":[]}]},{"t":"与合金、化合物的区别","c":[{"t":"与合金的区别","c":[{"t":"① 可具金属特性也可具非金属特性；合金以金属键为主、仅金属特性","c":[]},{"t":"② 组分间有明显界面并保持各自特性；合金组元以固溶体和化合物形式存在","c":[]},{"t":"③ 膨胀系数可很小、为零甚至为负；合金热膨胀系数大","c":[]},{"t":"④ 更高层次看：合金可视为固溶体与化合物复合而成的\"复合材料\"","c":[]}]},{"t":"与化合物的区别：化合物是交换电子发生化学反应的产物、单相结构体；复合材料多相、各组分保持自身结构","c":[]}]},{"t":"分类与命名","c":[{"t":"按基体：聚合物基 PMC · 金属基 MMC · 无机非金属基 CMC（陶瓷、玻璃、水泥、石墨）","c":[]},{"t":"按增强体种类：玻璃纤维 · 碳纤维 · 有机纤维 · 金属纤维 · 陶瓷纤维","c":[]},{"t":"按增强体形态：连续纤维 · 短纤维 · 颗粒 · 纺织（二维/三维编织体）","c":[]},{"t":"按用途：结构复合材料 · 功能复合材料","c":[]},{"t":"命名规则：增强体在前、基体在后，中间以 / 分隔，如 (Al2O3+TiB2)/Al；下标 p/w/f = 颗粒/晶须/纤维","c":[]}]},{"t":"发展历程与方向","c":[{"t":"四阶段","c":[{"t":"一（1940—1960）：玻璃纤维增强塑料","c":[]},{"t":"二（1960—1980）：碳纤维、Kevlar 增强环氧（飞机火箭主承力件）","c":[]},{"t":"三（1980—1990）：纤维增强铝基复合材料","c":[]},{"t":"四（1990—今）：多功能复合材料（智能、功能梯度等）","c":[]}]},{"t":"发展方向：功能 · 多功能 · 机敏 · 智能 · 纳米 · 仿生 · 分级结构 · 遗态","c":[]},{"t":"机敏复合材料：传感材料＋执行材料经基体复合 → 自诊断、自适应、自修复","c":[]},{"t":"智能复合材料：机敏＋人工智能系统（分析、决策、指挥执行）→ 功能复合材料发展最高境界","c":[]},{"t":"遗态复合材料：遗传自然生物结构形态＋化学组分变异，保留原始精细形貌","c":[]},{"t":"分级结构：不同尺度/形态多相物质相对有序排列，本质是仿生复合材料","c":[]}]},{"t":"⭐ 本章需掌握","c":[{"t":"复合材料的六大特点","c":[]},{"t":"复合材料与合金的区别","c":[]},{"t":"机敏 / 智能 / 遗态复合材料的定义","c":[]}]}]},{"t":"第2章 玻璃纤维","c":[{"t":"基本概念与结构","c":[{"t":"定义：非晶型（无定形）无机纤维；主成分 SiO2＋Ca、B、Na、Al、Fe 等氧化物","c":[]},{"t":"SiO2 的作用：形成骨架、具有高的熔点","c":[]},{"t":"结构特征：无长程有序、三维网络结构 → 各向同性","c":[]},{"t":"两种结构假说：微晶结构假说 · 网络结构假说","c":[]},{"t":"力学特征：应力—应变曲线为直线，无屈服无塑性，呈脆性","c":[]},{"t":"强度规律：直径越细、长度越短 → 强度越高（缺陷存在概率降低）","c":[]}]},{"t":"制备与表征","c":[{"t":"连续玻纤两种制备方法：坩埚法 · 池窑法","c":[]},{"t":"质量法（定重制）：tex＝1000 m 长原纱的克数（4 tex＝1000 m 重 4 g）","c":[]},{"t":"定长法（定长制）：支数＝每克原纱的长度 m（40 支＝每克长 40 m）","c":[]}]},{"t":"浸润剂与偶联剂","c":[{"t":"浸润剂作用：防纤维间摩擦划伤 · 表面改性便于与基体结合 · 防静电聚集","c":[]},{"t":"偶联剂：沃兰（甲基丙烯酸氯化铬络合物）· 硅烷偶联剂","c":[]},{"t":"沃兰偶联机理：水解 → 玻纤吸水生成羟基 → 沃兰间及与玻纤表面形成氢键 → 干燥缩合（醚化）→ 架起\"分子桥\"","c":[]}]},{"t":"⭐ 本章需掌握（考点清单）","c":[{"t":"增强体在复合材料中起什么作用？应具有什么特点？","c":[]},{"t":"玻璃结构两种假说（微晶 / 网络）的具体内容","c":[]},{"t":"玻纤表征方法：定长法与质量法的定义","c":[]},{"t":"硼纤维的分类；结构取决于什么因素","c":[]},{"t":"钨芯硼纤维残余应力：钨芯受压缩、硼层受周向拉伸","c":[]},{"t":"碳芯硼纤维残余应力：碳芯受拉伸（生成碳硼化合物体积膨胀）","c":[]},{"t":"有机纤维碳化法制碳纤维需满足的条件","c":[]},{"t":"碳化硅纤维的两种制备方法","c":[]},{"t":"氧化铝纤维的常见制备方法","c":[]},{"t":"晶须的定义及与纤维的区别","c":[]},{"t":"四针状 ZnO 晶须的特点（各向同性增强）","c":[]},{"t":"颗粒增强体：刚性（陶瓷）／延性（金属）两种","c":[]},{"t":"颗粒生产方式：外生型／内生型及内生型特点","c":[]},{"t":"碳纳米管的 3 种制备方法","c":[]},{"t":"超高分子量聚乙烯纤维的 2 种制备方法","c":[]}]}]},{"t":"第3章 碳纤维","c":[{"t":"定义与制备","c":[{"t":"定义：有机纤维经固相反应转变成的多晶纤维状聚合物碳（无机非金属材料，非单晶、非有机材料）","c":[]},{"t":"获得方法：有机纤维先驱丝碳化 · 气相生长法","c":[]},{"t":"有机纤维碳化三条件：碳化不熔融、保持纤维形态 · 碳化收率高 · 强度模量符合设计要求","c":[]},{"t":"工艺流程：纺丝 → 牵伸 → 稳定化（预氧化）→ 碳化 → 石墨化","c":[]},{"t":"预氧化：避免直接碳化时爆发有害的闭环、脱氧放热反应","c":[]},{"t":"碳化：惰性气氛（高纯 N2/Ar），约 1000~1500 ℃；高于 1500 ℃ 强度降、模量升 → 高强度碳纤维碳化温度应低于 1500 ℃","c":[]},{"t":"石墨化：约 3000 ℃、高纯 Ar，仅石墨纤维需要；程度升 → 模量升、强度降（裂纹缺陷）","c":[]}]},{"t":"表面处理（改性）","c":[{"t":"原因：表面类石墨微晶、惰性、表面能低、活性点少 → 浸润差、界面弱、层间剪切强度偏低","c":[]},{"t":"目的：不明显损伤本体强度下提高表面活性与表面能，增加极性基团与粗糙度","c":[]},{"t":"常用方法：气相/液相氧化 · 电化学（阳极）氧化 · 等离子体处理 · 上浆 · CVD 涂层 · 表面接枝 CNT/石墨烯（多尺度增强界面）","c":[]}]},{"t":"⭐ 本章需掌握（考点清单）","c":[{"t":"复合材料的五种设计类型","c":[]},{"t":"复合材料的设计步骤","c":[]},{"t":"复合效应的定义、分类及八大效应含义","c":[]},{"t":"单向排布长纤维增韧陶瓷基复合材料的增韧机理","c":[]},{"t":"晶须强韧的机制及影响因素","c":[]}]}]},{"t":"第4章 其他纤维","c":[{"t":"硼纤维","c":[{"t":"定义：在芯材（W、C、石英纤维）上气相沉积无定型原子硼 → 无机复合纤维","c":[]},{"t":"按芯材分类：钨芯 · 碳芯 · 石英纤维芯","c":[]},{"t":"形貌随芯材：W 芯 → \"玉米棒\"状；C 芯 → 表面光滑","c":[]},{"t":"最佳结构：无定型硼；最佳沉积温度 1200~1300 ℃（超过 1300 ℃ 出现晶态硼、强度下降）","c":[]},{"t":"结晶硼晶型：1200~1300 ℃ 一般为 β-菱形晶胞；低于 1200 ℃ 为 α-菱形晶胞","c":[]},{"t":"残余应力：钨芯——芯受压缩、硼层受周向拉伸；碳芯——芯受拉伸（反应生成碳硼化合物、体积膨胀）","c":[]},{"t":"表面涂层：沉积 SiC 层约 2.5 μm（β-SiC），阻止界面有害反应","c":[]}]},{"t":"SiC 纤维","c":[{"t":"两种制备方法：CVD 法（W 丝或 C 丝芯）· 先驱体法（1975 年矢岛圣使发明，典型产品尼卡纶 Nicalon）","c":[]},{"t":"CVD 法结构：芯材 ＋ 热解碳芯涂层（缓冲热膨胀失配）＋ SiC 多层沉积层 ＋ 表面富碳涂层","c":[]},{"t":"最外涂层三大作用：弥合表面裂纹提高强度 · 提供弱界面提高韧性 · 与金属基体反应提高结合","c":[]},{"t":"性能：1000 ℃ 以下力学性能基本不变；1300 ℃ 以上释放 CO、SiO 气体 → 减重、孔洞、晶粒长大、性能下降（降低含氧量可提高耐热性）","c":[]},{"t":"碳化硅吸波能力强 → 重要的吸波材料","c":[]}]},{"t":"氧化铝纤维","c":[{"t":"成分：以 Al2O3 为主，含少量 SiO2、B2O3 或 ZrO2、MgO","c":[]},{"t":"四种常见制备方法：杜邦法 · 拉晶法 · 住友法 · 溶胶—凝胶（sol-gel）法","c":[]}]},{"t":"晶须","c":[{"t":"定义：直径小于 3 μm 的单晶体生长的短纤维","c":[]},{"t":"与纤维的区别：近乎完美单晶 · 直径更细 · 内部缺陷极少 · 强度接近理论值","c":[]},{"t":"增韧机制：晶须桥联 · 晶须拔出 · 裂纹转向（\"晶须脆断\"不属于；桥联与拔出为主因）","c":[]},{"t":"影响因素：晶须强度越高增韧越强；界面结合由高到低：桥联 → 拔出；直径增大增韧下降；团聚减弱增韧（需分散均匀）","c":[]},{"t":"界面结合过高：增强提高、增韧略降；过低：增强增韧同步降低","c":[]},{"t":"四针状 ZnO 晶须：三维四针状结构 → 各向同性增强与改性","c":[]}]},{"t":"颗粒增强体","c":[{"t":"刚性颗粒（陶瓷颗粒）：高模量、高强度、高硬度、高热/化学稳定性 → 改善高温性能、耐磨、硬度、耐蚀","c":[]},{"t":"延性颗粒（金属颗粒）：主要增强基体韧性","c":[]},{"t":"延性颗粒增韧机制：裂纹尖端屏蔽 · 主裂纹周围微开裂 · 裂纹延性桥联（\"延性颗粒拔出\"不属于）","c":[]},{"t":"生产方式：外生型 · 内生型","c":[]},{"t":"内生型特点：基体内放热反应原位生成——表面无污染、界面干净、结合强度高、化学稳定性好，放热使挥发性杂质离开、净化基体","c":[]}]},{"t":"碳纳米管、石墨烯与有机纤维","c":[{"t":"碳纳米管 3 种制备方法：电弧放电法 · 激光蒸发法 · 化学气相沉积（CVD）法","c":[]},{"t":"石墨烯：二维纳米材料，世上最薄、最坚硬（比钻石硬）","c":[]},{"t":"有机高分子纤维：芳香族聚酰胺（PPTA/Kevlar）· 芳香族聚酯 · 超高分子量聚乙烯（UHMW-PE）","c":[]}]},{"t":"⭐ 本章需掌握（考点清单）","c":[{"t":"界面的定义","c":[]},{"t":"界面按宏观特性分的 5 类","c":[]},{"t":"界面作用的 5 种效应","c":[]},{"t":"界面形成的两个阶段","c":[]},{"t":"聚合物基复合材料界面作用机理的 8 种理论","c":[]},{"t":"改善聚合物基复合材料界面结合的原则","c":[]},{"t":"金属基复合材料界面的 3 种类型","c":[]},{"t":"沃兰与有机硅烷的作用机理","c":[]},{"t":"表面处理剂处理玻璃纤维的 3 种方法","c":[]}]}]},{"t":"第5章 复合材料的复合理论","c":[{"t":"复合材料设计","c":[{"t":"五种设计类型","c":[{"t":"安全设计：使用条件下不致失效（主要为强度和模量）","c":[]},{"t":"单项性能设计：某项性能达标（吸波、透波、零膨胀），兼顾其他","c":[]},{"t":"等强度设计：性能各向异性符合工况的方向性","c":[]},{"t":"等刚度设计：刚度满足变形限制且无过多冗余","c":[]},{"t":"优化设计：目标函数极值化（最低成本、最长寿命、最小质量）","c":[]}]},{"t":"软设计：利用模糊理论、混沌理论等软科学理论","c":[]},{"t":"虚拟设计：运用虚拟技术，过程复杂、必须由计算机完成","c":[]},{"t":"设计要点：组分间相容性（物理＋化学）；性能与结构、成型工艺密切相关","c":[]}]},{"t":"复合效应","c":[{"t":"定义：组分 A、B 复合后得到兼具两者性能特征的综合效果（不是化学反应生成新物质）","c":[]},{"t":"线性效应","c":[{"t":"平均效应：性能＝各组分性能×体积分数之和（加权平均）","c":[]},{"t":"平行效应：最简单线性效应，某项性能与某组分相当","c":[]},{"t":"相补效应：互补缺点产生优异综合性能，C＝A×B（正效应）","c":[]},{"t":"相抵效应：性能相互制约、低于混合定律预测值（负效应）","c":[]}]},{"t":"非线性效应","c":[{"t":"相乘效应：(X/Y)·(Y/Z)＝X/Z，功能转换复合产生新转换","c":[]},{"t":"系统效应：复合后具有单组分不具备的新性能","c":[]},{"t":"共振效应：多数性能受抑制、某一项性能充分发挥","c":[]},{"t":"诱导效应：一组分诱导另一组分结构改变 → 改变整体性能","c":[]}]}]},{"t":"颗粒增强机制","c":[{"t":"位错与颗粒两种作用方式：切过（颗粒强度小、硬度低、尺寸较大）· 绕过（强度高、硬度大、尺寸较小）","c":[]},{"t":"切过机制的强化来源：有序强化（反相畴界）· 界面强化 · 共格应变强化 · 层错强化 · 弹性模量差异","c":[]},{"t":"未切过机制：奥罗万（Orowan）——位错拱弯绕过、留下位错环 → 弥散强化；位错环使有效尺寸增大、间距变小、更难绕过","c":[]},{"t":"高温低应力：位错以攀移机制越过颗粒；局部攀移形成尖锐弯曲；脱离门槛应力＝攀移越过粒子后脱离所需最大应力","c":[]},{"t":"颗粒尺寸一般 1~50 μm：尺寸愈小、体积分数愈高，强化愈好","c":[]},{"t":"Hall-Petch 强化：颗粒钉扎细化基体晶粒（非直接强化）","c":[]},{"t":"热膨胀系数差异 → 颗粒周围残余应力场；模量差异 → 微观应力再分布","c":[]}]},{"t":"纤维增强机制","c":[{"t":"载荷承载比：与纤维/基体模量比、纤维体积分数有关","c":[]},{"t":"各组分应力承载比＝相应弹性模量之比","c":[]},{"t":"变形四阶段：双线弹性 → 纤维线弹性＋基体非线弹性 → 双非线弹性 → 纤维断裂、复合材料断裂","c":[]},{"t":"短切纤维：最小体积分数 Vmin 与临界体积分数 Vcrit；临界纤维长度与临界长径比","c":[]},{"t":"单向短纤维横向弹性模量：仅与体积分数、模量比有关，与长径比无关","c":[]}]},{"t":"陶瓷基复合材料的强韧机制","c":[{"t":"纤维强韧化原因：裂纹扩展受纤维阻碍 · 界面脱黏/桥联/拔出/断裂耗能 · 纤维断裂不在同一平面使裂纹转向（\"基体晶粒粗化\"不属于）","c":[]},{"t":"界面结合强度要适中：满足脱黏、滑移阻力适中、既有载荷传递又有较长拔出；纤维脱黏是桥联与拔出的前提","c":[]},{"t":"晶须增韧机制：晶须桥联 · 晶须拔出 · 裂纹转向","c":[]},{"t":"颗粒增韧：裂纹偏转 · 微裂纹增韧 · 残余应力增韧 · ZrO2 相变增韧","c":[]},{"t":"选材原则：使用温度 980~2000 ℃ 宜选陶瓷基体","c":[]}]},{"t":"⭐ 本章需掌握（考点清单）","c":[{"t":"聚合物基复合材料的六大特点","c":[]},{"t":"热塑性预浸料制备：预浸渍技术（溶液/熔融预浸，树脂完全浸渍纤维）与后浸渍技术（膜层叠、粉末浸渍、纤维混杂/混编，成型过程中完成浸渍）","c":[]}]}]},{"t":"第6章 复合材料的界面基本理论","c":[{"t":"界面的基本概念","c":[{"t":"定义：基体与增强体间成分、性能显著变化，起彼此结合与载荷传递作用的微小区域（界面层/界面相）；不是几何面，是有一定厚度的三维区域","c":[]},{"t":"界面作用：传递载荷（界面剪切应力）· 阻断裂纹吸收断裂能（脱黏、桥联、拔出、偏转）· 缓解调节应力集中 · 决定影响整体性能（层间剪切、疲劳、耐蚀老化、失效模式）","c":[]},{"t":"按宏观特性五类：机械结合 · 溶解与润湿结合 · 反应结合 · 交换反应结合 · 混合结合","c":[]},{"t":"界面有无反应层/过渡区取决于制备工艺，不能一概而论","c":[]}]},{"t":"润湿性","c":[{"t":"接触角 θ 表征：θ<90° 能润湿、越小越好；θ＝0° 完全润湿；θ>90° 不润湿","c":[]},{"t":"间接评价：铺展系数 · 黏附功 · 润湿速率 · 毛细上升高度","c":[]},{"t":"改善润湿性途径：增强体表面处理（偶联剂、氧化、等离子体、涂层）· 基体改性（表面活性剂、降黏）· 工艺调控（提温延时）· 施加外力（真空、加压浸渗、模压、热压罐）· 改善分散浸渍（超声、高速搅拌、真空除泡）","c":[]}]},{"t":"三类复合材料的界面","c":[{"t":"聚合物基：界面层可视为单独的相又依赖两边相；结合力＝宏观机械咬合＋微观化学键/次价键，化学键最强、应多引入反应基团；形成两阶段＝接触与润湿 → 聚合物固化（胶粒/胶絮非均匀结构）","c":[]},{"t":"金属基：热膨胀系数差异大 → 残余应力大、界面微裂纹；高温易反应生成脆性化合物；多数陶瓷增强体与金属熔体润湿性差；结合形式多样","c":[]},{"t":"陶瓷基：一般需要弱界面 → 利于脱黏、纤维拔出、裂纹偏转，实现增韧","c":[]}]},{"t":"增强体的表面处理","c":[{"t":"玻璃纤维：偶联剂处理（沃兰、硅烷）——水解后与表面羟基缩合、另一端与树脂反应或相容 → \"分子桥\"","c":[]},{"t":"碳纤维：气相/液相氧化 · 阳极氧化 · 等离子体 · 上浆 · CVD 涂层（热解碳、SiC、BN）· 接枝 CNT/石墨烯","c":[]},{"t":"PPTA（芳纶）：等离子体处理 · 化学接枝 · 偶联剂涂层","c":[]},{"t":"UHMW-PE：等离子体处理 · 铬酸氧化 · 接枝改性","c":[]},{"t":"金属基用纤维：涂 C、BN、SiC、TiB2 等涂层——兼作扩散/反应阻挡层、改善润湿、缓解残余应力","c":[]}]},{"t":"界面的表征方法","c":[{"t":"界面形态：TEM · HRTEM · SEM","c":[]},{"t":"界面成分","c":[{"t":"AES 俄歇能谱：空间分辨率高、深度剖析、轻元素灵敏","c":[]},{"t":"XPS 光电子能谱：元素价态与化学环境、判断化学键与新相","c":[]},{"t":"EDS / EPMA：点线面元素分布、测互扩散区与反应层厚度（EPMA 定量精度更高）","c":[]},{"t":"EELS：配合 TEM 纳米尺度成分与键合（C、N、O、B 轻元素）","c":[]},{"t":"SIMS：痕量元素与深度剖析；XRD：物相鉴定","c":[]}]},{"t":"界面结合强度：单纤维拔出试验（求 IFSS）· 微滴脱黏试验 · 压出 push-out／压入 push-in（显微压痕，常用于陶瓷基、金属基）· 宏观辅助（ILSS 短梁三点弯曲、横向拉伸、断裂韧性）＋断口 SEM · 单丝断裂（碎裂）试验","c":[]},{"t":"界面残余应力：XRD 法与中子衍射法（中子透射更深但受源限制）；X 射线只能测表层","c":[]},{"t":"增强体表面性能：接触角与表面能 · XPS · AFM","c":[]}]},{"t":"界面残余应力与优化设计","c":[{"t":"产生原因：热膨胀系数失配（最主要）· 弹性模量差异 · 界面反应新相与固化/凝固收缩 · 工艺因素（压力、冷却速率、致密化不均）","c":[]},{"t":"影响：过大拉应力 → 微裂纹、结合强度与载荷传递下降；适当压应力 → 增摩擦阻力、利于拔出与偏转、提高韧性；也会引起翘曲与尺寸不稳定","c":[]},{"t":"调控手段：增强体涂层 · 梯度界面层 · 匹配热膨胀系数 · 引入塑性/柔性界面层 · 适当热处理","c":[]}]},{"t":"⭐ 本章需掌握（考点清单）","c":[{"t":"陶瓷材料的性能优点及致命弱点","c":[]},{"t":"陶瓷材料中的化学键类型","c":[]},{"t":"陶瓷基复合材料的 3 种增韧体","c":[]},{"t":"陶瓷基复合材料强韧化的途径","c":[]},{"t":"颗粒弥散增强陶瓷基时弥散相颗粒的选择原则","c":[]},{"t":"纤维增强陶瓷基时纤维的选择原则","c":[]},{"t":"碳/碳复合材料的特点","c":[]}]}]},{"t":"第7章 聚合物基复合材料","c":[{"t":"基体与增强体","c":[{"t":"基体：热固性树脂（环氧、酚醛、不饱和聚酯）· 热塑性树脂 · 橡胶","c":[]},{"t":"增强体：玻璃纤维 · 碳纤维 · 芳纶纤维","c":[]},{"t":"预浸料：增强体浸渍树脂的半成品 → 模压、热压罐、缠绕等工艺的原料","c":[]}]},{"t":"成型工艺","c":[{"t":"手糊成型：手工铺放＋涂刷固化；设备简单、成本低、可做大型复杂件（船体、浴缸、风电叶片外壳）；质量依赖人工、效率低、孔隙率较高","c":[]},{"t":"模压成型：预混料/SMC/BMC 加热加压固化；尺寸精度高、表面光洁、效率高，适合批量（汽车覆盖件、电器壳体）","c":[]},{"t":"喷射成型：短切纤维与树脂同时喷涂压实；效率高、适合大件；纤维短且随机、强度较低（浴盆、储罐内衬）","c":[]},{"t":"拉挤成型：连续纤维浸胶经热模连续拉出；等截面型材（管、棒、工字），纤维含量高、纵向强度高、自动化程度高","c":[]},{"t":"缠绕成型：按规律缠绕芯模固化脱模；纤维取向可设计、比强度高，适合回转体（压力容器、管道、火箭发动机壳体）","c":[]},{"t":"其他工艺：预浸料—热压罐（航空航天、低孔隙）· RTM 树脂传递模塑（闭模双面光洁、中批量）· 真空袋压/真空辅助 · 注射成型（短纤维粒料小型复杂件）","c":[]}]},{"t":"性能特点","c":[{"t":"高比强度、比模量：密度 1.4~2.0 g/cm3（钢的 1/5~1/4、钛合金 1/3~1/2）；高模量碳纤/环氧比强度＝钢 5 倍、铝 4 倍","c":[]},{"t":"抗疲劳好：界面阻止裂纹扩展、破坏渐进有预兆；疲劳强度可达拉伸强度 70%~80%（金属仅 1/3~1/2）","c":[]},{"t":"减振性好：界面吸振；自振频率与比模量平方根成正比 → 避免工作早期破坏","c":[]},{"t":"耐烧蚀性卓越：比热容大、熔化热气化热高、高温吸热","c":[]},{"t":"可设计性强、成型工艺简单：改变增强体/基体/含量/分布；整体成型、无须二次加工","c":[]},{"t":"过载安全：少量增强体破坏后载荷重新分布，不致短期失去承载能力","c":[]}]},{"t":"界面与力学性能","c":[{"t":"界面形成机理：接触与润湿（增强体优先吸附降低表面能的基团）→ 聚合物固化形成固定界面层（热固性树脂：胶粒/胶絮非均匀结构）","c":[]},{"t":"改善界面结合原则：改善树脂对增强体浸润 · 适度界面黏结 · 减小残余应力（引入塑性层）· 调节界面内应力、减缓应力集中（柔性界面层、热处理消除横晶内应力）","c":[]},{"t":"力学性能：静态（拉伸、压缩、弯曲、剪切）· 疲劳 · 冲击韧性","c":[]}]},{"t":"⭐ 本章需掌握（考点清单）","c":[{"t":"金属基复合材料中基体的选用原则","c":[]},{"t":"内生型金属基复合材料中增强体的特点","c":[]}]}]},{"t":"第8章 陶瓷基复合材料","c":[{"t":"基体与增强体","c":[{"t":"陶瓷优点：耐高温 · 硬度高 · 耐磨损 · 耐腐蚀 · 相对密度小；致命缺点＝脆性 → \"增韧\"是研究重点","c":[]},{"t":"化学键：共价键与离子键之间的混合键（用电负性表征接近程度）","c":[]},{"t":"增强体：纤维（C、SiC、Al2O3）· 晶须（SiC、Si3N4）· 颗粒（SiC、TiB2、ZrO2）","c":[]}]},{"t":"制备工艺（重点）","c":[{"t":"粉体制备：机械粉碎与球磨；化学法——溶胶-凝胶 · 共沉淀 · 水热/溶剂热 · 醇盐水解 · CVD · 喷雾热解；目标＝高纯、超细、粒度分布窄、分散性好","c":[]},{"t":"成型：干压 · 冷等静压 CIP · 注浆 · 流延 · 注射 · 挤压 · 凝胶注模；纤维增强需先制纤维预制体浸渍浆料，或 PIP / CVI 致密化","c":[]},{"t":"烧结：常压 · 热压 HP · 热等静压 HIP · 反应烧结 · 液相烧结 · 放电等离子 SPS · 微波烧结；纤维增强常用 PIP、CVI、反应熔体渗透 RMI（熔 Si 浸渗 → C/C-SiC）","c":[]},{"t":"工艺总原则：提高致密化 · 控制界面 · 减少缺陷 · 避免纤维高温损伤","c":[]}]},{"t":"典型陶瓷基复合材料","c":[{"t":"氧化物基：Al2O3 基 · ZrO2 基（应力诱导相变增韧、微裂纹增韧）","c":[]},{"t":"非氧化物基：SiC 基 · Si3N4 基","c":[]}]},{"t":"碳/碳复合材料","c":[{"t":"全由碳元素组成，低温与很高温度下物化力学性能均良好","c":[]},{"t":"相对密度小（<2.0 g/cm3，镍基高温合金 1/4、陶瓷 1/2）→ 极高比强度、比弹性模量","c":[]},{"t":"高烧蚀热、低烧蚀率、烧蚀均匀，可承受 3000 ℃ → 火箭发动机喷管、喉衬","c":[]},{"t":"耐磨优异、摩擦系数小、性能稳定 → 耐磨与摩擦部件最佳候选","c":[]},{"t":"生物相容性好，密度模量与人体骨骼相当 → 人工骨骼、牙齿理想候选","c":[]}]},{"t":"⭐ 本章需掌握（考点清单）","c":[{"t":"什么是遗态复合材料？什么是分级结构？","c":[]},{"t":"剪切增稠液（STF）的含义与组成","c":[]},{"t":"剪切增稠液的流变特性","c":[]},{"t":"剪切增稠液的两种增稠机理","c":[]}]}]},{"t":"第9章 金属基复合材料","c":[{"t":"基本特点与分类","c":[{"t":"与合金的区别：合金以固溶体和化合物形式存在；金属基复材保留增强体与基体各自特性、有明显界面，性能可设计性强","c":[]},{"t":"分类：按基体——铝基 · 镁基 · 钛基 · 铜基 · 金属间化合物基；按增强体——长纤维 · 短纤维 · 晶须 · 颗粒","c":[]},{"t":"性能：高比强度比模量 · 疲劳与断裂韧性好 · 耐高温 · 导电导热好 · 耐磨 · 热膨胀系数低可设计 · 不吸潮不老化、气密性好","c":[]}]},{"t":"制备工艺（重点）","c":[{"t":"内生型（原位自生）","c":[{"t":"方法：XD 放热弥散 · 自蔓延高温合成 SHS · 原位反应铸造（LSM 混合盐、DMR 直接熔体、VLS 气-液）· 反应喷射沉积 · 机械合金化＋反应烧结","c":[]},{"t":"优点：增强体表面无污染、界面干净、结合强度高、化学稳定性好、细小均匀，放热净化基体","c":[]},{"t":"缺点：增强体种类与体积分数受反应体系限制、工艺控制难度大","c":[]}]},{"t":"外生型","c":[{"t":"粉末冶金法：混粉—压制—烧结/热压/HIP，适合 SiCp/Al 等颗粒、晶须增强","c":[]},{"t":"液态金属法：搅拌铸造 · 挤压铸造/压力浸渗 · 真空吸铸 · 喷射沉积","c":[]},{"t":"固态扩散结合法：箔—纤维—箔热压、热等静压，用于 SiCf/Ti 等长纤维增强","c":[]},{"t":"优点：种类选择自由、体积分数易控、工艺适应性强；缺点：表面易污染、界面易有害反应、需改善润湿、成本较高","c":[]}]}]},{"t":"典型金属基复合材料","c":[{"t":"铝基：SiC、Al2O3、B4C、C 纤维增强；界面易生成 Al4C3 脆性相 → 涂层或合金化控制","c":[]},{"t":"镁基：轻量化优势明显；SiC、Al2O3、碳纤维增强","c":[]},{"t":"钛基：SiC 纤维增强、高温性能好；界面反应控制是关键（C、TiB2 涂层）","c":[]},{"t":"金属间化合物基 · 铜基：铜基兼顾高导电导热与高强度耐磨（C 纤维、SiC、Al2O3 颗粒增强）","c":[]}]},{"t":"界面特点与控制措施","c":[{"t":"界面特点：热膨胀差大 → 残余应力大甚至微裂纹 · 高温反应生成脆性金属间化合物 · 陶瓷增强体与金属熔体润湿差 · 结合形式多样 · 界面层直接决定载荷传递与断裂行为","c":[]},{"t":"控制措施：增强体涂层（C、BN、SiC、TiB2 兼阻挡层）· 基体合金化（Mg、Li、Ti、Zr 改润湿或抑制反应）· 优化工艺（降温、缩短高温停留、控冷却速率，压力浸渗、真空吸铸促浸润）· 采用固相法（粉末冶金、热压、扩散结合）· 反应层控至纳米级实现\"强而不脆\" · 梯度/柔性界面层","c":[]}]}]},{"t":"第10章 新型复合材料","c":[{"t":"遗态复合材料","c":[{"t":"定义：利用自然生物/植物独特结构形态，经结构形态遗传＋化学组分变异处理，保留自然生物精细形貌结构的新型复合材料","c":[]},{"t":"与仿生、分级结构的区别：遗态＝沿用保留原始结构；仿生＝模仿其结构；分级结构＝仿照不同尺度独特结构、只求结构相似","c":[]},{"t":"典型模板与产物","c":[{"t":"木材模板：C/C、Si/SiC/C、SiO2/C、SiOC/C、硅化物/木质、Fe2O3-Fe3O4/C、CoO/Co/C","c":[]},{"t":"木质材料模板：木质碳/碳 · 木质碳/金属","c":[]},{"t":"叶片模板：梧桐叶遗态 Fex/TiO2（光催化）· 桂花叶脉遗态 C/Fe2O3（吸光）· 茭白叶片遗态 Cu/C（消光）","c":[]},{"t":"稻壳/椰壳模板：C/Fe 电磁屏蔽、光催化","c":[]},{"t":"硅藻土/螺旋藻模板：Cu/Ag 导电、吸附过滤","c":[]},{"t":"其他：叶绿素遗态 TiO2/SiO2、酵母菌遗态 Ti-W-Si 光催化空心微球","c":[]}]}]},{"t":"其他新型复合材料","c":[{"t":"分级结构复合材料：不同尺度/形态多相有序排列（蜘蛛网、竹子、树木），本质是仿生复合材料","c":[]},{"t":"剪切增稠液（STF）柔性防护复合材料：高剪切速率（冲击）下黏度急剧上升、液态 → 类固态转变耗能吸能，用于柔性防护装备","c":[]},{"t":"教材拓展：超高性能水泥基 · 高熵合金基（高熵、晶格畸变、迟滞扩散、鸡尾酒效应）· 生物复合材料","c":[]},{"t":"我国航空航天应用：运-20 舱内阻燃玻纤/环氧、玻纤/酚醛 · C919、CR929 与全复材轻型公务机碳纤维 · T800/T1000/T1200 级碳纤维持续发展","c":[]}]}]}]}</script>
<script>
(function () {
  'use strict';
  var rootEl = document.getElementById('ccm-root');
  var vp = document.getElementById('ccm-vp');
  var world = document.getElementById('ccm-world');
  var edgeG = document.getElementById('ccm-edges');
  var qInput = document.getElementById('ccm-q');

  var jumpSel = document.getElementById('ccm-jump');
  var data = JSON.parse(document.getElementById('ccm-data').textContent);
  var STANDALONE = rootEl.classList.contains('st-app');

  var HUES = [8, 28, 46, 92, 150, 175, 205, 235, 275, 322];

  /* ---------- model ---------- */
  var nodes = [];
  function build(d, parent, depth) {
    var n = { t: d.t, p: parent, d: depth, kids: null, col: false, id: nodes.length, ch: 0, star: false, vis: false };
    nodes.push(n);
    if (d.c && d.c.length) n.kids = d.c.map(function (k) { return build(k, n, depth + 1); });
    return n;
  }
  var rootNode = build(data, null, 0);
  var chapters = rootNode.kids || [];
  function assignCh(n, i) {
    n.ch = i;
    (n.kids || []).forEach(function (k) { assignCh(k, i); });
  }
  chapters.forEach(function (c, i) { assignCh(c, i); });
  (function star(n, s) {
    n.star = s || n.t.indexOf('⭐') === 0;
    (n.kids || []).forEach(function (k) { star(k, n.star); });
  })(rootNode, false);
  (function cnt(n) {
    var c = 0;
    (n.kids || []).forEach(function (k) { c += 1 + cnt(k); });
    n.ndesc = c;
    return c;
  })(rootNode);

  /* ---------- dom ---------- */
  var svgNS = 'http://www.w3.org/2000/svg';
  var frag = document.createDocumentFragment();
  nodes.forEach(function (n) {
    var el = document.createElement('div');
    el.className = 'mm-node d' + Math.min(n.d, 3) + (n.d >= 3 && !n.kids ? ' leaf' : '') + (n.star ? ' star' : '');
    var m = n.t.match(/^([^：]{1,14})：(.+)$/);
    if (m && n.d >= 3) {
      var b = document.createElement('span');
      b.className = 'mm-term';
      b.textContent = m[1] + '：';
      el.appendChild(b);
      el.appendChild(document.createTextNode(m[2]));
    } else {
      el.textContent = n.t;
    }
    var h = n.ch, sat = 62, li = 50;
    if (n.star) { h = 42; sat = 90; li = 44; }
    var alpha = n.d <= 1 ? 0.15 : 0.10;
    el.style.setProperty('--nb', 'hsl(' + h + ' ' + sat + '% ' + li + '% / ' + alpha + ')');
    el.style.setProperty('--nc', 'hsl(' + h + ' ' + sat + '% ' + li + '% / ' + (n.d <= 1 ? 0.55 : 0.32) + ')');
    var badge = document.createElement('span');
    badge.className = 'mm-badge';
    badge.textContent = '＋' + n.ndesc;
    el.appendChild(badge);
    n.el = el; n.badge = badge;
    frag.appendChild(el);

    var p = document.createElementNS(svgNS, 'path');
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-width', '1.5');
    p.setAttribute('stroke-linecap', 'round');
    n.edge = p;
    edgeG.appendChild(p);
  });
  world.appendChild(frag);

  var opt0 = document.createElement('option');
  opt0.value = '-1';
  opt0.textContent = '跳转章节…';
  jumpSel.appendChild(opt0);
  chapters.forEach(function (c, i) {
    var o = document.createElement('option');
    o.value = String(i);
    o.textContent = c.t;
    jumpSel.appendChild(o);
  });

  /* ---------- state ---------- */
  var restored = false;
  if (STANDALONE) {
    try {
      var saved = JSON.parse(localStorage.getItem('ccm-collapsed-v1') || '[]');
      saved.forEach(function (id) { if (nodes[id] && nodes[id].kids) { nodes[id].col = true; restored = true; } });
    } catch (e) { /* ignore */ }
  }
  var saveTimer = null;
  function saveState() {
    if (!STANDALONE) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        var col = nodes.filter(function (n) { return n.col; }).map(function (n) { return n.id; });
        localStorage.setItem('ccm-collapsed-v1', JSON.stringify(col));
      } catch (e) { /* ignore */ }
    }, 400);
  }

  /* ---------- layout ---------- */
  var gapX = 54, gapY = 9, x0 = 30, y0 = 26;
  var pan = { x: 0, y: 0 }, k = 1;

  function setVis(n) {
    n.vis = true;
    var kids = (n.kids && !n.col) ? n.kids : null;
    (kids || []).forEach(setVis);
  }
  function applyView() {
    world.style.transform = 'translate(' + pan.x + 'px,' + pan.y + 'px) scale(' + k + ')';
  }
  function relayout() {
    nodes.forEach(function (n) { n.vis = false; });
    setVis(rootNode);
    nodes.forEach(function (n) { n.el.style.display = n.vis ? '' : 'none'; });
    var colW = [];
    nodes.forEach(function (n) {
      if (!n.vis) return;
      n.w = n.el.offsetWidth; n.h = n.el.offsetHeight;
      colW[n.d] = Math.max(colW[n.d] || 0, n.w);
      if (n.kids && n.col) { n.badge.style.display = ''; } else { n.badge.style.display = 'none'; }
    });
    var colX = [x0];
    for (var d = 1; d < colW.length; d++) colX[d] = colX[d - 1] + (colW[d - 1] || 0) + gapX;
    function hsub(n) {
      var kids = (n.kids && !n.col) ? n.kids : null;
      if (!kids || !kids.length) { n.hs = n.h; return n.hs; }
      var s = 0;
      kids.forEach(function (kk) { s += hsub(kk) + gapY; });
      n.hs = Math.max(n.h, s - gapY);
      return n.hs;
    }
    hsub(rootNode);
    (function assignY(n, yTop) {
      n.cy = yTop + n.hs / 2;
      n.x = colX[n.d];
      var kids = (n.kids && !n.col) ? n.kids : null;
      if (!kids) return;
      var tot = 0;
      kids.forEach(function (kk) { tot += kk.hs; });
      tot += gapY * (kids.length - 1);
      var ky = yTop + (n.hs - tot) / 2;
      kids.forEach(function (kk) { assignY(kk, ky); ky += kk.hs + gapY; });
    })(rootNode, y0);
    nodes.forEach(function (n) {
      if (!n.vis) { n.edge.style.display = 'none'; return; }
      n.el.style.transform = 'translate(' + n.x + 'px,' + (n.cy - n.h / 2) + 'px)';
      if (n.p && n.p.vis && !n.p.col) {
        var x1 = n.p.x + n.p.w, y1 = n.p.cy, x2 = n.x, y2 = n.cy;
        var mx = (x1 + x2) / 2;
        n.edge.style.display = '';
        n.edge.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2);
        var h = n.star ? 42 : HUES[n.ch % HUES.length];
        n.edge.setAttribute('stroke', 'hsl(' + h + ' ' + (n.star ? 90 : 62) + '% ' + (n.star ? 55 : 50) + '% / 0.45)');
      } else {
        n.edge.style.display = 'none';
      }
    });
    applyView();
  }
  function bboxOf(list) {
    var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    list.forEach(function (n) {
      x1 = Math.min(x1, n.x); x2 = Math.max(x2, n.x + n.w);
      y1 = Math.min(y1, n.cy - n.h / 2); y2 = Math.max(y2, n.cy + n.h / 2);
    });
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }
  function fitTo(bbox, pad) {
    var vw = vp.clientWidth, vh = vp.clientHeight;
    pad = pad || 26;
    k = Math.min((vw - pad * 2) / bbox.w, (vh - pad * 2) / bbox.h, 1.15);
    k = Math.max(k, 0.1);
    pan.x = (vw - bbox.w * k) / 2 - bbox.x * k;
    pan.y = (vh - bbox.h * k) / 2 - bbox.y * k;
    applyView();
  }
  function fitAll() { fitTo(bboxOf(nodes.filter(function (n) { return n.vis; }))); }
  function zoomAt(cx, cy, factor) {
    var nk = Math.min(2.5, Math.max(0.1, k * factor));
    pan.x = cx - (cx - pan.x) * (nk / k);
    pan.y = cy - (cy - pan.y) * (nk / k);
    k = nk;
    applyView();
  }

  /* ---------- interactions ---------- */
  function toggle(n) {
    if (!n.kids) return;
    n.col = !n.col;
    relayout();
    saveState();
  }
  function nodeFromEl(el) {
    while (el && el !== world && !(el.classList && el.classList.contains('mm-node'))) el = el.parentNode;
    for (var i = 0; i < nodes.length; i++) if (nodes[i].el === el) return nodes[i];
    return null;
  }
  var pointers = {}, pinch = null, downInfo = null;
  vp.addEventListener('pointerdown', function (e) {
    vp.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(pointers).length === 1) {
      downInfo = { x: e.clientX, y: e.clientY, t: Date.now(), moved: false, target: e.target };
      vp.classList.add('dragging');
    } else if (Object.keys(pointers).length === 2) {
      var ps = Object.keys(pointers).map(function (id2) { return pointers[id2]; });
      pinch = {
        d: Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y),
        cx: (ps[0].x + ps[1].x) / 2 - vp.getBoundingClientRect().left,
        cy: (ps[0].y + ps[1].y) / 2 - vp.getBoundingClientRect().top
      };
    }
  });
  vp.addEventListener('pointermove', function (e) {
    if (!pointers[e.pointerId]) return;
    var prev = pointers[e.pointerId];
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(pointers).length === 1) {
      if (downInfo && Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y) > 5) downInfo.moved = true;
      pan.x += dx; pan.y += dy;
      applyView();
    } else if (Object.keys(pointers).length === 2 && pinch) {
      var ps = Object.keys(pointers).map(function (id2) { return pointers[id2]; });
      var nd = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
      if (pinch.d > 0) zoomAt(pinch.cx, pinch.cy, nd / pinch.d);
      pinch.d = nd;
    }
  });
  function endPointer(e) {
    if (pointers[e.pointerId] && downInfo && !downInfo.moved && Date.now() - downInfo.t < 600 && Object.keys(pointers).length === 1) {
      var n = nodeFromEl(downInfo.target);
      if (n) toggle(n);
    }
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinch = null;
    if (!Object.keys(pointers).length) { downInfo = null; vp.classList.remove('dragging'); }
  }
  vp.addEventListener('pointerup', endPointer);
  vp.addEventListener('pointercancel', endPointer);
  vp.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = vp.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016));
  }, { passive: false });

  /* ---------- actions ---------- */
  function setChaptersView() {
    nodes.forEach(function (n) { if (n.kids) n.col = n.d >= 2; });
  }
  function setAllCol(col) {
    nodes.forEach(function (n) { if (n.kids) n.col = col; });
    rootNode.col = false;
  }
  function centerOn(n) {
    var vw = vp.clientWidth, vh = vp.clientHeight;
    var nk = Math.max(k, 0.9);
    pan.x = vw / 2 - (n.x + n.w / 2) * nk;
    pan.y = vh / 2 - n.cy * nk;
    k = nk;
    applyView();
  }
  var actions = {
    home: function () { fitAll(); },
    chapters: function () { setChaptersView(); relayout(); fitAll(); saveState(); },
    expand: function () { setAllCol(false); relayout(); saveState(); },
    collapse: function () { setAllCol(true); relayout(); fitAll(); saveState(); },
    zoomin: function () { zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1.25); },
    zoomout: function () { zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 0.8); },
    fit: function () { fitAll(); }
  };
  rootEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (b && actions[b.getAttribute('data-act')]) actions[b.getAttribute('data-act')]();
  });
  jumpSel.addEventListener('change', function () {
    var i = parseInt(jumpSel.value, 10);
    if (isNaN(i)) return;
    if (i < 0) { setChaptersView(); relayout(); fitAll(); saveState(); return; }
    setChaptersView();
    var c = chapters[i];
    c.col = false;
    (c.kids || []).forEach(function (s) { s.col = !(s.kids); });
    relayout();
    var list = [];
    (function walk(n) { if (n.vis) list.push(n); (n.kids || []).forEach(function (kk) { if (n.vis && !n.col) walk(kk); }); })(c);
    fitTo(bboxOf(list), 40);
    saveState();
  });

  /* ---------- search ---------- */
  var debounce = null;
  function clearSearch() {
    nodes.forEach(function (n) { n.el.classList.remove('hit'); });
    countEl.textContent = '';
  }
  function doSearch() {
    clearSearch();
    var q = qInput.value.trim();
    if (!q) return;
    var hits = [];
    nodes.forEach(function (n) {
      if (n.t.indexOf(q) !== -1) { hits.push(n); n.el.classList.add('hit'); }
    });
    hits.forEach(function (n) {
      var p = n.p;
      while (p) { p.col = false; p = p.p; }
    });
    relayout();
    countEl.textContent = hits.length ? hits.length + ' 处' : '无结果';
    if (hits.length) centerOn(hits[0]);
  }
  qInput.addEventListener('input', function () {
    clearTimeout(debounce);
    debounce = setTimeout(doSearch, 280);
  });
  qInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(debounce); doSearch(); }
    if (e.key === 'Escape') { qInput.value = ''; clearSearch(); }
  });

  /* ---------- init ---------- */
  if (!restored) setChaptersView();
  relayout();
  fitAll();
})();

</script>
</body>
</html>
